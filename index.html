<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glosario Interactivo - Don Samuel</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mind-ar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #start-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        padding: 15px 30px;
        font-size: 18px;
        background-color: #2b6cb0;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <button id="start-button">Escanear Infografía</button>

    <a-scene id="ar-scene" embedded mindar-image="imageTargetSrc: https://raw.githubusercontent.com/yagaca-del/don-samuel-ar/main/glosario_mision1.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="blue" opacity="0.8" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('#ar-scene');
      const startButton = document.querySelector('#start-button');
      
      sceneEl.style.display = 'none';

      startButton.addEventListener('click', () => {
        startButton.style.display = 'none';
        sceneEl.style.display = 'block';
        const system = sceneEl.systems["mindar-image-system"];
        if (system) {
          system.start();
        }
      });
    </script>
  </body>
</html>
