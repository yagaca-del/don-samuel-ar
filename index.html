<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión 1: Don Samuel - Constitución 1991</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
    <style>
      body, html { 
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background: #0f172a; 
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas { touch-action: none; }
      #info-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <div id="info-overlay">Misión 1: Desliza para explorar el glosario</div>

    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera id="camera" position="0 1.6 3" orbit-controls="target: 0 1 0; minDistance: 1; maxDistance: 10; enableDamping: true; dampingFactor: 0.05;"></a-camera>
      
      <a-light type="ambient" color="#fff" intensity="0.9"></a-light>
      <a-light type="directional" position="2 4 2" intensity="1"></a-light>

      <!-- Panel principal que simula la tarjeta del glosario de la Constitución -->
      <a-entity position="0 1 0">
        <!-- Tarjeta de fondo -->
        <a-plane color="#1e3a8a" width="2" height="1.2" roughness="0.2" position="0 0 0">
          <!-- Texto simulado o etiqueta de la Constitución -->
          <a-text value="Constitucion 1991\nDon Samuel" align="center" color="#ffffff" position="0 0.3 0.01" scale="0.8 0.8 0.8"></a-text>
          <a-text value="Mision 1: El mapa de la convivencia" align="center" color="#93c5fd" position="0 -0.2 0.01" scale="0.4 0.4 0.4"></a-text>
        </a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
