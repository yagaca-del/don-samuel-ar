<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 1: Don Samuel</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #0f172a; }
      #info-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 12px 24px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <div id="info-overlay">Desliza el dedo para girar el elemento interactivo</div>

    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera id="camera" position="0 1.6 3" orbit-controls="target: 0 1 0; minDistance: 1; maxDistance: 10; enableDamping: true; dampingFactor: 0.05;"></a-camera>
      
      <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
      <a-light type="directional" position="2 4 2" intensity="1"></a-light>

      <a-entity position="0 1 0">
        <a-box color="#3182ce" width="1.2" height="1.2" depth="1.2" roughness="0.2" animation="property: rotation; to: 360 360 0; loop: true; dur: 10000; easing: linear;"></a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
