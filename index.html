<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 1: Don Samuel</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #0f172a; }
      #info-overlay {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info-overlay">Desliza el dedo para explorar el elemento interactivo</div>

    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 3" look-controls="enabled: true"></a-camera>
      
      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="2 4 2"></a-light>

      <a-entity position="0 1 0" rotation="0 45 0">
        <a-box color="#3182ce" width="1.2" height="1.2" depth="1.2" roughness="0.3"></a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
