<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glosario Interactivo - Don Samuel</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mind-ar-image-aframe.prod.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
  </style>
</head>
<body>
  <a-scene 
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/yagaca-del/don-samuel-ar/main/glosario_mision1.mind; smooth: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="ar-video" src="https://raw.githubusercontent.com/yagaca-del/don-samuel-ar/main/video_mision1.mp4" crossorigin="anonymous" loop playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#ar-video" position="0 0 0" width="1" height="1.77" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector("#ar-video");
    const targetEntity = document.querySelector('[mindar-image-target]');

    targetEntity.addEventListener("targetFound", event => {
      video.play();
    });
    targetEntity.addEventListener("targetLost", event => {
      video.pause();
    });
  </script>
</body>
</html>
