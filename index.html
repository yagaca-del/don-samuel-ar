<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glosario Interactivo - Don Samuel</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mind-ar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #111; }
      #start-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding: 20px;
      }
      #start-button {
        padding: 16px 32px;
        font-size: 20px;
        background-color: #2b6cb0;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(43,108,176,0.5);
      }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h2 style="margin-bottom: 10px;">Misión 1: Don Samuel</h2>
      <p style="margin-bottom: 25px; color: #cbd5e0; font-size: 14px; max-width: 280px;">Toca el botón para activar la experiencia interactiva en tu celular.</p>
      <button id="start-button">Iniciar Experiencia</button>
    </div>

    <a-scene id="ar-scene" embedded mindar-image="imageTargetSrc: https://raw.githubusercontent.com/yagaca-del/don-samuel-ar/main/glosario_mision1.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="#3182ce" opacity="0.9" position="0 0 0" height="0.8" width="0.8" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('#ar-scene');
      const startScreen = document.querySelector('#start-screen');
      const startButton = document.querySelector('#start-button');
      
      sceneEl.style.display = 'none';

      startButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.style.display = 'block';
        const system = sceneEl.systems["mindar-image-system"];
        if (system) {
          system.start();
        }
      });
    </script>
  </body>
</html>
